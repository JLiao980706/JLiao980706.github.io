<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Fangshuo (Jasper) Liao</title>
    <meta name="author" content="Fangshuo Liao">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
  </head>
  <body>
    <table style="width:100%;max-width:800px;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;">
      <tbody>
        <tr style="padding:0px">
          <td style="padding:0px">

            <!-- Bio section: content comes from data/bio.js -->
            <table style="width:100%;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;">
              <tbody>
                <tr class="header-row" style="padding:0px">
                  <td class="header-bio" style="padding:2.5%;width:63%;vertical-align:middle">
                    <p class="name" style="text-align:left;" id="bio-name"></p>
                    <div id="bio-paragraphs"></div>
                    <p style="text-align:center" id="bio-links"></p>
                  </td>
                  <td class="header-photo" style="padding:2.5%;width:37%;max-width:37%;vertical-align:middle;text-align:center;">
                    <img style="width:80%;max-width:80%;object-fit:cover;" src="images/headshot.jpg" alt="Fangshuo Liao">
                  </td>
                </tr>
              </tbody>
            </table>

            <!-- Publications heading -->
            <table style="width:100%;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;">
              <tbody>
                <tr>
                  <td style="padding:20px;width:100%;vertical-align:middle">
                    <h2>Publications</h2>
                    <p>* denotes equal contribution.</p>
                  </td>
                </tr>
              </tbody>
            </table>

            <!-- Paper entries: rendered from data/papers.js -->
            <div id="papers-container"></div>

            <!-- Footer -->
            <table style="width:100%;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;">
              <tbody>
                <tr>
                  <td style="padding:0px">
                    <br>
                    <p style="text-align:center;font-size:small;">
                      Design adapted from <a href="https://jonbarron.info/">Jon Barron's website</a>.
                    </p>
                  </td>
                </tr>
              </tbody>
            </table>

          </td>
        </tr>
      </tbody>
    </table>

    <!-- Load data files then render -->
    <script src="data/bio.js"></script>
    <script src="data/papers.js"></script>
    <script>
      // ── Render bio ──────────────────────────────────────────────────────────
      document.getElementById("bio-name").textContent = bio.name;

      const parasEl = document.getElementById("bio-paragraphs");
      bio.paragraphs.forEach(function(text) {
        const p = document.createElement("p");
        p.innerHTML = text;
        parasEl.appendChild(p);
      });

      const linksEl = document.getElementById("bio-links");
      linksEl.innerHTML = bio.links.map(function(l) {
        return '<a href="' + l.url + '">' + l.label + '</a>';
      }).join(" &nbsp;/&nbsp; ");

      // ── Render papers ───────────────────────────────────────────────────────
      const container = document.getElementById("papers-container");

      papers.forEach(function(p) {
        const badgeHTML = p.badge.replace(/\n/g, "<br>");

        const linkHTML = p.links.map(function(l) {
          return '<a href="' + l.url + '">' + l.label + '</a>';
        }).join(" / ");

        // Left cell: show image if images/papers/{key}.png exists, else badge
        const imgSrc = "images/papers/" + p.key + ".png?v=2";
        const leftCellHTML =
          '<img src="' + imgSrc + '" alt="" ' +
            'style="width:100%;max-width:100%;display:block;" ' +
            'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' +
          '<div class="venue-badge" style="display:none;">' + badgeHTML + '</div>';

        const row = document.createElement("table");
        row.style.cssText = "width:100%;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;";
        row.innerHTML =
          '<tbody><tr class="paper-row">' +
            '<td class="paper-img-cell" style="padding:20px 8px;width:25%;vertical-align:middle">' +
              leftCellHTML +
            "</td>" +
            '<td class="paper-txt-cell" style="padding:20px;width:75%;vertical-align:middle">' +
              '<a href="' + p.url + '"><span class="papertitle">' + p.title + "</span></a><br>" +
              p.authors + "<br>" +
              "<em>" + p.venueFull + "</em><br>" +
              linkHTML +
              "<p>" + p.abstract + "</p>" +
            "</td>" +
          "</tr></tbody>";
        container.appendChild(row);
      });
    </script>
  </body>
</html>
